<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenMind</title>

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="apple-touch-icon" href="../img/icons/icon-192.png">
    <link rel="icon" href="../img/icons/icon-192.png">

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/nav-lateral.css">
</head>
<body>

<header class="header">
    <div class="header-texto header-com-logo">
        <img src="../img/logo.png" alt="OpenMind" class="logo-header">
        <div>
            <h1 id="saudacao">Olá</h1>
            <p>OpenMind · Learn. Practice. Evolve.</p>
        </div>
    </div>
</header>

<main class="container">

    <!-- Treino de hoje -->
    <section class="card-treino-hoje">
        <span class="rotulo-treino">Today's Training</span>
        <h2 id="duracaoTreino">60 min</h2>
        <button id="btnIniciarTreino" class="botao-iniciar-treino">Start Training</button>
    </section>

    <!-- Estatísticas rápidas -->
    <section class="grid-estatisticas">
        <div class="stat-card">
            <span class="stat-icone">🔥</span>
            <span class="stat-valor" id="statStreak">0</span>
            <span class="stat-rotulo">Sequência</span>
        </div>
        <div class="stat-card">
            <span class="stat-icone">⭐</span>
            <span class="stat-valor" id="statXp">0</span>
            <span class="stat-rotulo">XP</span>
        </div>
        <div class="stat-card">
            <span class="stat-icone">🏅</span>
            <span class="stat-valor" id="statNivel">1</span>
            <span class="stat-rotulo">Nível</span>
        </div>
        <div class="stat-card">
            <span class="stat-icone">✅</span>
            <span class="stat-valor" id="statExercicios">0</span>
            <span class="stat-rotulo">Exercícios</span>
        </div>
        <div class="stat-card">
            <span class="stat-icone">🎯</span>
            <span class="stat-valor" id="statAcertos">--</span>
            <span class="stat-rotulo">Taxa de acertos</span>
        </div>
    </section>

    <!-- Recomendação do dia -->
    <section class="card-recomendacao" id="cardRecomendacao">
        <p id="textoRecomendacao">Carregando recomendações...</p>
    </section>

    <!-- Matérias -->
    <section class="secao">
        <div class="secao-titulo">
            <h2>📚 Matérias</h2>
            <a href="subjects.html" class="link-ver-todas">Ver todas</a>
        </div>
        <div class="lista-materias" id="listaMaterias"></div>
    </section>

    <!-- Technical English -->
    <section class="secao">
        <div class="secao-titulo">
            <h2>🇺🇸 Technical English</h2>
            <a href="vocabulary.html" class="link-ver-todas">Ver tudo</a>
        </div>
        <div class="card-ingles">
            <div class="ingles-item">
                <span class="ingles-numero" id="vocabTotal">0</span>
                <span class="ingles-rotulo">Palavras</span>
            </div>
            <div class="ingles-item">
                <span class="ingles-numero" id="vocabDominadas">0</span>
                <span class="ingles-rotulo">Dominadas</span>
            </div>
            <div class="ingles-item">
                <span class="ingles-numero" id="vocabRevisar">0</span>
                <span class="ingles-rotulo">Revisar</span>
            </div>
        </div>
    </section>

</main>

<script type="module" src="../js/dashboard.js"></script>
<script src="../js/pwa.js"></script>
<script src="../js/nav-lateral.js"></script>

</body>
</html>
