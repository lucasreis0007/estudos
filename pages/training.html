<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino · OpenMind</title>

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link rel="apple-touch-icon" href="../img/icons/icon-192.png">
    <link rel="icon" href="../img/icons/icon-192.png">

    <link rel="stylesheet" href="../css/training.css">
    <link rel="stylesheet" href="../css/nav-lateral.css">
</head>
<body>

<header class="header">
    <button class="voltar" onclick="window.location.href='dashboard.html'">←</button>
    <div class="header-texto">
        <h1 data-i18n="training.title">🎯 Treino</h1>
        <p id="contadorQuestao">Carregando...</p>
    </div>
</header>

<main class="container">

    <div class="barra-progresso-topo">
        <div class="barra-progresso-topo-preenchimento" id="barraProgresso"></div>
    </div>

    <!-- ---------------- QUESTÃO ---------------- -->
    <section id="viewQuestao" class="oculto">

        <span class="pill-dificuldade" id="pillDificuldade"></span>

        <h2 class="texto-questao" id="textoQuestao"></h2>

        <div class="lista-opcoes" id="listaOpcoes"></div>

        <div class="painel-correcao oculto" id="painelCorrecao">
            <p class="resultado-correcao" id="resultadoCorrecao"></p>
            <p class="explicacao-correcao" id="explicacaoCorrecao"></p>

            <div class="bloco-vocabulario oculto" id="blocoVocabulario">
                <p class="vocabulario-titulo" data-i18n="training.relatedVocabulary">🔤 Vocabulário Técnico</p>
                <div id="listaVocabularioTreino"></div>
            </div>

            <button class="botao-primario" id="btnProxima" data-i18n="training.next">Próxima</button>
        </div>

    </section>

    <!-- ---------------- SEM EXERCÍCIOS ---------------- -->
    <section id="viewVazio" class="oculto">
        <p class="carregando" data-i18n="training.noExercises">Ainda não há exercícios cadastrados para esta matéria.</p>
        <button class="botao-primario" onclick="window.location.href='dashboard.html'" data-i18n="training.backToHome">Voltar ao início</button>
    </section>

    <!-- ---------------- RESULTADO FINAL ---------------- -->
    <section id="viewResultado" class="oculto">
        <div class="card-resultado">
            <span class="resultado-icone">🏁</span>
            <h2 data-i18n="training.finished">Treino concluído!</h2>
            <p class="resultado-resumo" id="resumoResultado"></p>
            <button class="botao-primario" onclick="window.location.href='dashboard.html'" data-i18n="training.backToDashboard">Voltar ao Dashboard</button>
        </div>
    </section>

</main>

<script type="module" src="../js/training.js"></script>
<script src="../js/pwa.js"></script>
<script type="module" src="../js/nav-lateral.js"></script>

</body>
</html>
